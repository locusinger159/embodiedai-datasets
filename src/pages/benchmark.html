<!DOCTYPE html>
<html lang="zh-CN">
<head>{{HEAD}}
</head>
<body>
{{NAVBAR}}
<main class="benchmark-main">
  <div class="benchmark-header">
    <h1>{{BENCHMARK_HEADING}}</h1>
    <p>{{BENCHMARK_DESC}}</p>
    <div class="benchmark-meta">
      <span class="benchmark-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>{{BM_METRIC_LABEL}}{{BENCHMARK_METRIC}}</span>
      <span class="benchmark-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21.3 8.7 8.7 21.3a1 1 0 0 1-1.4 0L2.7 16.7a1 1 0 0 1 0-1.4L15.3 2.7a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1 0 1.4Z"/><path d="m7.5 10.5 2 2"/><path d="m10.5 7.5 2 2"/><path d="m13.5 4.5 2 2"/></svg>{{BM_UNIT_LABEL}}{{BENCHMARK_UNIT}}</span>
      <span class="benchmark-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h1M9 13h1M9 17h1M14 9h1M14 13h1M14 17h1"/></svg>{{BENCHMARK_ORG}}</span>
    </div>
  </div>

  <div class="leaderboard-table">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>{{BM_COL_TRAINING}}</th>
          <th>{{BM_COL_MODEL}}</th>
          <th style="text-align:right">{{BM_COL_SCORE}}</th>
        </tr>
      </thead>
      <tbody>
        {{LEADERBOARD_ROWS}}
      </tbody>
    </table>
  </div>

  <p class="leaderboard-footer">{{BM_FOOTER}}</p>

  <a href="/benchmarks/" class="back-link">{{BENCHMARK_BACK}}</a>
</main>
{{FOOTER}}
</body>
</html>
